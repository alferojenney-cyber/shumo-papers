<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem("sm-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数模论文库</title>
<style>
/* 左侧导航 + 右侧赛事分区；字号阶梯 13 / 15 / 16 / 26 / 30 */
:root{
  --bg:#F3F4F8;--bg2:#E9ECF5;--side:rgba(255,255,255,.78);--card:#FFFFFF;--fg:#191C24;--muted:#737A88;--line:#E1E4EC;
  --hover:rgba(25,28,36,.05);--note:#FFFFFF;--shadow:0 1px 2px rgba(20,24,40,.04),0 6px 20px rgba(20,24,40,.06);
  --shadow-hi:0 14px 34px rgba(20,24,40,.14);
  --guosai:#D9463E;--huawei:#3461E0;--huashu:#159A6A;--mathorcup:#D07B12;--brand1:#4F6BFF;--brand2:#9B5CFF;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1116;--bg2:#161A24;--side:rgba(22,25,33,.82);--card:#1A1D25;--fg:#ECEEF3;--muted:#8E95A3;--line:#272B36;
  --hover:rgba(255,255,255,.06);--note:#1A1D25;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --shadow-hi:0 16px 40px rgba(0,0,0,.55);
  --guosai:#F07A72;--huawei:#7C9CFF;--huashu:#4FD39E;--mathorcup:#F2A950;--brand1:#7C8CFF;--brand2:#B98BFF;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1116;--bg2:#161A24;--side:rgba(22,25,33,.82);--card:#1A1D25;--fg:#ECEEF3;--muted:#8E95A3;--line:#272B36;
  --hover:rgba(255,255,255,.06);--note:#1A1D25;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --shadow-hi:0 16px 40px rgba(0,0,0,.55);
  --guosai:#F07A72;--huawei:#7C9CFF;--huashu:#4FD39E;--mathorcup:#F2A950;--brand1:#7C8CFF;--brand2:#B98BFF;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(1200px 600px at 85% -10%,var(--bg2),transparent 70%),var(--bg);background-attachment:fixed;color:var(--fg);
  font:16px/1.6 -apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;-webkit-font-smoothing:antialiased;transition:background-color .3s,color .3s}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand1);outline-offset:2px}

.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:0;height:100vh;padding:32px 18px 24px;display:flex;flex-direction:column;gap:24px;
  background:var(--side);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px;font-size:21px;font-weight:700;letter-spacing:.06em}
.logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;font-size:18px;font-weight:700;
  background:linear-gradient(135deg,var(--brand1),var(--brand2));box-shadow:0 6px 16px color-mix(in srgb,var(--brand1) 40%,transparent)}
.search{width:100%;height:42px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:15px;transition:border-color .2s,box-shadow .2s}
.search:focus{outline:none;border-color:var(--brand1);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand1) 18%,transparent)}
nav{display:flex;flex-direction:column;gap:4px}
.nav{position:relative;display:flex;align-items:center;gap:12px;width:100%;height:44px;padding:0 14px;border:0;border-radius:12px;background:none;cursor:pointer;text-align:left;font-size:16px;transition:background .2s,color .2s}
.nav:hover{background:var(--hover)}
.nav i{width:10px;height:10px;border-radius:50%;background:var(--c,linear-gradient(135deg,var(--brand1),var(--brand2)));flex:none;transition:transform .2s}
.nav[aria-current="true"]{background:color-mix(in srgb,var(--c,var(--brand1)) 13%,transparent);color:var(--c,var(--brand1));font-weight:600}
.nav[aria-current="true"] i{transform:scale(1.25)}
.foot{margin-top:auto;display:flex;gap:8px}
.pill{flex:1;height:40px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;font-size:15px;transition:background .2s,transform .15s}
.pill:hover{background:var(--hover)}
.pill:active{transform:scale(.97)}

main{padding:40px 48px 80px}
.zone{max-width:1080px;margin:0 auto 56px;animation:rise .5s ease both}
.zone-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.zone-head h2{margin:0;font-size:26px;font-weight:700;letter-spacing:.02em}
.zone-head i{width:12px;height:12px;border-radius:4px;background:var(--c);box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 18%,transparent)}
.zone-head{margin-bottom:22px}
.zone-head::after{content:"";flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 40%,transparent),transparent)}
.nums{display:flex;flex-wrap:wrap;gap:8px}
.num{display:inline-grid;place-items:center;height:40px;min-width:64px;padding:0 16px;border:1.5px solid color-mix(in srgb,var(--c) 30%,transparent);border-radius:20px;
  background:color-mix(in srgb,var(--c) 10%,var(--card));color:var(--c);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px}
.card{position:relative;display:flex;flex-direction:column;padding:0;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:var(--shadow);
  overflow:hidden;cursor:pointer;text-align:left;animation:rise .5s ease both;animation-delay:calc(var(--i) * 45ms);
  transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s}
.card:hover{transform:translateY(-6px);box-shadow:var(--shadow-hi);border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.cover{position:relative;aspect-ratio:4/3;max-width:100%;overflow:hidden;background:#fff}
.cover img{display:block;width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.card:hover .cover img{transform:scale(1.05)}
.cover::after{content:"";position:absolute;inset:auto 0 0;height:40%;background:linear-gradient(transparent,rgba(0,0,0,.06))}
.tag{position:absolute;left:12px;top:12px;z-index:1;min-width:34px;height:30px;padding:0 10px;border-radius:9px;background:var(--c);color:#fff;font-size:15px;font-weight:700;
  display:grid;place-items:center;box-shadow:0 4px 12px color-mix(in srgb,var(--c) 45%,transparent)}
.card p{margin:0;padding:14px 16px 16px;font-size:16px;line-height:1.55;font-weight:600;border-top:1px solid var(--line)}
.card::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--c);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.card:hover::after{transform:scaleX(1)}
.none{color:var(--muted);padding:60px 0;text-align:center;font-size:16px}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.reader{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:var(--bg);animation:fade .2s ease}
.top{display:flex;align-items:center;gap:14px;padding:12px 18px;background:var(--side);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top button,.top a{height:38px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;font-size:15px;color:var(--fg);text-decoration:none;display:inline-flex;align-items:center;white-space:nowrap;transition:background .2s}
.top button:hover,.top a:hover{background:var(--hover)}
.top p{flex:1;min-width:0;margin:0;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
#view{flex:1;display:flex}
#view iframe{flex:1;width:100%;border:0}
.modal{position:fixed;inset:0;z-index:30;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:24px;background:rgba(8,10,16,.55);backdrop-filter:blur(6px);animation:fade .2s ease}
.modal figure{margin:0;max-width:min(360px,100%);background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.4);animation:pop .25s cubic-bezier(.2,.8,.2,1)}
.modal img{display:block;width:100%;height:auto}
.modal button{display:block;width:100%;height:48px;border:0;border-top:1px solid var(--line);background:var(--card);cursor:pointer;font-size:16px}
.notice{width:560px;max-width:100%;max-height:calc(100vh - 48px);display:flex;flex-direction:column;background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.4);animation:pop .3s cubic-bezier(.2,.8,.2,1)}
.notice h3{margin:0;padding:26px 28px 6px;font-size:22px;font-weight:700;display:flex;align-items:center;gap:12px}
.notice h3::before{content:"";width:6px;height:22px;border-radius:3px;background:linear-gradient(var(--brand1),var(--brand2))}
.notice .body{overflow:auto;padding:8px 28px 4px;font-size:16px;line-height:1.85}
.notice .body p{margin:0 0 12px}
.notice .go{width:auto;margin:14px 28px 26px;height:46px;border:0;border-radius:12px;color:#fff;font-size:16px;font-weight:600;cursor:pointer;
  background:linear-gradient(135deg,var(--brand1),var(--brand2));box-shadow:0 8px 20px color-mix(in srgb,var(--brand1) 35%,transparent);transition:transform .15s,filter .2s}
.notice .go:hover{filter:brightness(1.06)}
.notice .go:active{transform:scale(.98)}
.sep{height:1px;background:var(--line);margin:4px 10px}
.nav svg{width:18px;height:18px;flex:none;margin-left:-4px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
.nav.page[aria-current="true"]{background:color-mix(in srgb,var(--brand1) 13%,transparent);color:var(--brand1)}
.lead{margin:-4px 0 20px;color:var(--muted);font-size:15px;max-width:720px}
.masonry{columns:3 260px;column-gap:20px}
.fb{break-inside:avoid;margin:0 0 20px;border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);cursor:zoom-in;
  animation:rise .5s ease both;animation-delay:calc(var(--i) * 60ms);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.fb:hover{transform:translateY(-4px);box-shadow:var(--shadow-hi)}
.fb img{display:block;width:100%;height:auto}
.fb figcaption{padding:12px 16px 14px;font-size:15px;line-height:1.6}
.rules{max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:12px 36px 28px;animation:rise .5s ease both}
.rules h3{margin:26px 0 8px;font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px}
.rules h3::before{content:"";width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--brand1),var(--brand2));flex:none}
.rules p{margin:0 0 10px 18px;font-size:16px;line-height:1.85}
.light{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:24px;background:rgba(8,10,16,.82);cursor:zoom-out;animation:fade .2s ease}
.light img{max-width:min(100%,900px);max-height:calc(100vh - 48px);border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.5);animation:pop .25s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.94)}}

@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside{position:sticky;z-index:5;height:auto;min-width:0;padding:14px 16px 12px;gap:12px;border-right:0;border-bottom:1px solid var(--line);
    display:grid;grid-template-columns:1fr auto;align-items:center}
  .brand{font-size:19px;padding:0}
  .logo{width:32px;height:32px;font-size:16px;border-radius:9px}
  .search,nav{grid-column:1/-1}
  #nav2{margin-top:-6px}
  .sep{display:none}
  .foot{grid-row:1;grid-column:2;margin:0}
  .pill{flex:none;height:34px;padding:0 12px;font-size:14px}
  nav{flex-direction:row;overflow-x:auto;gap:6px;scrollbar-width:none}
  .nav{width:auto;flex:none;height:36px;font-size:15px;border:1px solid var(--line);background:var(--card)}
  main{padding:24px 16px 56px}
  .zone-head h2{font-size:22px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
  .card p{font-size:15px;padding:12px 12px 14px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><span class="logo">数</span>数模论文库</div>
    <input class="search" id="q" type="search" placeholder="搜索" autocomplete="off">
    <nav id="nav"></nav>
    <nav id="nav2"></nav>
    <div class="foot"><button class="pill" id="contact">联系方式</button><button class="pill" id="theme">深色</button></div>
  </aside>
  <main id="main"></main>
</div>

<div class="modal" id="notice" hidden><div class="notice" role="dialog" aria-modal="true" aria-labelledby="ntitle"><h3 id="ntitle"></h3><div class="body" id="nbody"></div><button class="go" id="ngo">进入</button></div></div>

<div class="modal" id="modal" hidden><figure><img src="contact.jpg" data-fresh alt="QQ 二维码" width="1080" height="1549"><button id="mclose">关闭</button></figure></div>

<div class="light" id="light" hidden><img alt=""></div>

<div class="reader" id="reader" hidden>
  <div class="top">
    <button id="back">返回</button>
    <i></i>
    <p id="rt"></p>
    <a id="orig" target="_blank" rel="noopener">新窗口</a>
  </div>
  <div id="view"></div>
</div>

<script>for(const f of ["text.js","numbers.js","notice.js","feedback.js","rules.js"])document.write('<script src="'+f+'?v='+Date.now()+'"><\/script>')</script>
<script>
const T=window.SITE||{};
const PAPERS=(window.PAPERS||[]).map(p=>({id:p.编号,comp:p.赛事,letter:p.题号,title:p.题目,kw:String(p.关键词||'').split(/\s+/),path:p.文件}));
const COMPS=Object.entries(T.赛事||{});
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const url=p=>encodeURI(p.path).replace(/#/g,'%23');
const store={get(k){try{return localStorage.getItem(k)||''}catch(e){return ''}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}};
let filter=store.get('sm-filter')||'all';
if(filter!=='all'&&!COMPS.some(c=>c[0]===filter))filter='all';

const FB=window.FEEDBACK||{},RU=window.RULES||{};
const ICON={notice:'<svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg>',feedback:'<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5"/></svg>',rules:'<svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7M9 7h3"/></svg>'};
let view='list';
function nav(){
  $('#nav2').innerHTML='<div class="sep"></div>'+[...((window.NOTICE_TEXT||'').trim()?[['notice','通知']]:[]),['feedback',FB.页面名||'一些反馈'],['rules',RU.页面名||'规则']].map(([k,n])=>`<button class="nav page" data-v="${k}" aria-current="${k!=='notice'&&view===k}">${ICON[k]}${esc(n)}</button>`).join('');
  $('#nav').innerHTML=[['all',T.全部||'全部'],...COMPS].map(([k,n])=>`<button class="nav" data-k="${k}" aria-current="${view==='list'&&filter===k}"${k==='all'?'':` style="--c:var(--${k})"`}><i></i>${n}</button>`).join('');
}
function renderFeedback(){
  const items=(FB.图片||[]).map(x=>typeof x==='string'?{文件:x}:x).filter(x=>x&&x.文件);
  const src=x=>'feedback/'+encodeURIComponent(x.文件);
  $('#main').innerHTML=`<section class="zone" style="--c:var(--brand1)"><div class="zone-head"><i></i><h2>${esc(FB.页面名||'一些反馈')}</h2></div>
    ${FB.说明?`<p class="lead">${esc(FB.说明)}</p>`:''}
    ${items.length?`<div class="masonry">${items.map((x,i)=>`<figure class="fb" data-src="${src(x)}" style="--i:${i}"><img src="${src(x)}" alt="${esc(x.说明||'')}" loading="lazy">${x.说明?`<figcaption>${esc(x.说明)}</figcaption>`:''}</figure>`).join('')}</div>`:''}
  </section>`;
}
function renderRules(){
  const blocks=String(RU.正文||'').trim().split(/\n\s*\n/).filter(Boolean);
  const html=blocks.map(b=>b.split('\n').reduce((acc,line)=>{
    const t=line.trim();if(!t)return acc;
    if(t.startsWith('#'))acc.push(`<h3>${esc(t.replace(/^#+\s*/,''))}</h3>`);
    else if(acc.length&&acc[acc.length-1].startsWith('<p>'))acc[acc.length-1]=acc[acc.length-1].replace(/<\/p>$/,`<br>${esc(t)}</p>`);
    else acc.push(`<p>${esc(t)}</p>`);
    return acc},[]).join('')).join('');
  $('#main').innerHTML=`<section class="zone" style="--c:var(--brand1)"><div class="zone-head"><i></i><h2>${esc(RU.页面名||'规则')}</h2></div><article class="rules">${html}</article></section>`;
}
const NUMS=window.NUMBERS||{};
const nums=(k,n)=>String(NUMS[n]??NUMS[k]??'').split(/[^\d.]+/).filter(Boolean);
function render(){
  if(view==='feedback')return renderFeedback();
  if(view==='rules')return renderRules();
  const q=$('#q').value.trim().toLowerCase();
  let h='',i=0;
  for(const [k,n] of COMPS){
    if(filter!=='all'&&filter!==k)continue;
    const ps=PAPERS.filter(p=>p.comp===k&&(!q||(p.title+p.kw.join('')+n).toLowerCase().includes(q))).sort((a,b)=>a.letter.localeCompare(b.letter));
    if(q&&!ps.length)continue;
    h+=`<section class="zone" style="--c:var(--${k})">
      <div class="zone-head"><i></i><h2>${n}</h2>${(x=>x.length?`<div class="nums">${x.map(v=>`<span class="num">${v}</span>`).join('')}</div>`:'')(nums(k,n))}</div>
      <div class="grid">${ps.map(p=>`<button class="card" data-id="${p.id}" style="--i:${i++}"><div class="cover"><img src="thumbs/${p.id}.jpg" alt="" loading="lazy"><span class="tag">${p.letter}</span></div><p>${esc(p.title)}</p></button>`).join('')}</div>
    </section>`;
  }
  $('#main').innerHTML=h||`<p class="none">${esc(T.没有搜到||'')}</p>`;
}
$('#nav').onclick=e=>{const b=e.target.closest('.nav');if(!b)return;filter=b.dataset.k;store.set('sm-filter',filter);if(view!=='list'){location.hash='';return}nav();render();scrollTo({top:0,behavior:'smooth'})};
$('#nav2').onclick=e=>{const b=e.target.closest('.nav');if(!b)return;if(b.dataset.v==='notice')$('#notice').hidden=false;else location.hash=b.dataset.v};
$('#q').oninput=()=>{if(view!=='list')location.hash='';else render()};
$('#main').addEventListener('click',e=>{const c=e.target.closest('.card');if(c)location.hash=c.dataset.id;const f=e.target.closest('.fb');if(f){$('#light img').src=f.dataset.src;$('#light').hidden=false}});
$('#light').onclick=()=>{$('#light').hidden=true};
const setText=(sel,v)=>{if(v!=null)$(sel).textContent=v};
document.title=T.标题||document.title;
$('.brand').innerHTML=`<span class="logo">${esc(T.图标字||'')}</span>${esc(T.标题||'')}`;
$('#q').placeholder=T.搜索框提示||'';
setText('#contact',T.联系方式);setText('#ngo',T.进入);setText('#mclose',T.关闭);setText('#back',T.返回);setText('#orig',T.新窗口);
$('#modal img').alt=T.二维码说明||'';
const root=document.documentElement;
const isDark=()=>root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
const themeLabel=()=>{$('#theme').textContent=isDark()?(T.切到浅色||'浅色'):(T.切到深色||'深色')};
$('#theme').onclick=()=>{const t=isDark()?'light':'dark';root.dataset.theme=t;store.set('sm-theme',t);themeLabel()};
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',themeLabel);
const NT=(window.NOTICE_TEXT||'').trim();
if(NT){
  $('#ntitle').textContent=window.NOTICE_TITLE||'通知';
  $('#nbody').innerHTML=NT.split(/\n\s*\n/).map(x=>`<p>${esc(x.trim()).replace(/\n/g,'<br>')}</p>`).join('');
  $('#notice').hidden=false;
}
const closeNotice=()=>{$('#notice').hidden=true};
$('#ngo').onclick=closeNotice;
$('#contact').onclick=()=>{const im=$('#modal img');if(im.dataset.fresh!=null){im.src='contact.jpg?v='+Date.now();delete im.dataset.fresh}$('#modal').hidden=false};
$('#mclose').onclick=()=>{$('#modal').hidden=true};
$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').hidden=true};

function open(id){
  const p=PAPERS.find(x=>x.id===id);if(!p)return close();
  $('#reader').style.setProperty('--c',`var(--${p.comp})`);
  $('#rt').textContent=p.title;
  $('#orig').href=url(p);
  $('#view').innerHTML=`<iframe title="${esc(p.title)}" src="${url(p)}#view=FitH"></iframe>`;
  $('#reader').hidden=false;document.body.style.overflow='hidden';
}
function close(){$('#reader').hidden=true;$('#view').innerHTML='';document.body.style.overflow=''}
$('#back').onclick=()=>{location.hash=''};
addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!$('#light').hidden)$('#light').hidden=true;else if(!$('#notice').hidden)closeNotice();else if(!$('#modal').hidden)$('#modal').hidden=true;else if(!$('#reader').hidden)location.hash=''});
function route(){
  const id=location.hash.slice(1);
  if(/^p\d\d$/.test(id))return open(id);
  close();
  const v=id==='feedback'||id==='rules'?id:'list';
  if(v!==view){view=v;nav();render();scrollTo(0,0)}
}
addEventListener('hashchange',route);
themeLabel();nav();render();route();
</script>
</body>
</html>
